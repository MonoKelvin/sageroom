[package]
name = "sageroom-contracts"
version = "0.2.5"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[[bin]]
name = "export_contracts"
path = "../src/bin/export_contracts.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
