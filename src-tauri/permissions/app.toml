[[permission]]
identifier = "app-snapshot"
description = "读取本地应用公开快照"
commands.allow = ["app_get_snapshot"]

[[permission]]
identifier = "chat-send"
description = "以本地用户身份提交聊天文本"
commands.allow = ["chat_send"]

[[permission]]
identifier = "chat-recall"
description = "在宿主身份与单调期限校验后撤回本地用户消息"
commands.allow = ["chat_recall"]

[[permission]]
identifier = "chat-quotes"
description = "有界只读解析仍有效的本地消息引用"
commands.allow = ["chat_resolve_quotes"]

[[permission]]
identifier = "chat-list"
description = "分页读取本地聊天"
commands.allow = ["chat_list"]

[[permission]]
identifier = "chat-search"
description = "检索本地聊天文本"
commands.allow = ["chat_search"]

[[permission]]
identifier = "search-cancel"
description = "取消当前窗口的检索"
commands.allow = ["cancel_search"]

[[permission]]
identifier = "appearance-save"
description = "保存本地界面外观"
commands.allow = ["appearance_save"]

[[permission]]
identifier = "app-exit"
description = "明确退出本地应用"
commands.allow = ["app_request_exit", "app_exit_ready"]

[[permission]]
identifier = "configuration-read"
description = "读取本地全局预设、成员配置和用户资料"
commands.allow = ["global_configuration_get", "agent_list", "user_profile_get"]

[[permission]]
identifier = "configuration-write"
description = "保存绑定世代和版本的本地配置与资料"
commands.allow = ["global_configuration_save", "agent_save", "agent_runtime_control", "user_profile_save"]

[[permission]]
identifier = "credentials-manage"
description = "写入模型凭据，只返回是否配置"
commands.allow = ["secret_set", "secret_status"]

[[permission]]
identifier = "model-test"
description = "受限模型连通测试、模型列表读取与仅开发版本的临时模型导入"
commands.allow = ["model_profile_test", "model_profile_list", "development_model_import"]

[[permission]]
identifier = "experience-manage"
description = "读取与维护每个智能体独立的经历文件"
commands.allow = ["experience_list", "experience_add", "experience_delete", "experience_prune"]

[[permission]]
identifier = "avatar-manage"
description = "原生选择头像并以不透明对象标识读取"
commands.allow = ["avatar_import", "avatar_read"]

[[permission]]
identifier = "clipboard-read"
description = "读取系统剪贴板纯文本，用于输入框粘贴"
commands.allow = ["clipboard_read_text"]
