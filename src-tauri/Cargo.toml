[package]
name = "sageroom"
version = "0.2.2"
description = "本地优先的智能体聊天室"
authors = ["MonoKelvin"]
edition = "2024"
rust-version = "1.90"
license = "MIT"
default-run = "sageroom"

[lib]
name = "sageroom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "=2.5.5"
rusqlite = { version = "=0.43.0", features = ["bundled", "backup", "hooks"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
uuid = { version = "=1.29.3", features = ["v7", "serde"] }
sha2 = "=0.11.1"
base64 = "=0.23.1"
genai = { version = "=0.7.5", default-features = false, features = ["rustls-tls", "system-proxy"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "query", "system-proxy"] }
tracing = "=0.1.44"
tokio = { version = "=1.54.1", features = ["time", "sync", "macros"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
tauri-plugin-dialog = { version = "=2.8.4", default-features = false }
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
